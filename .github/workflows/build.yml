name: Build Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            profile: build-mac
            artifact_name: installer-macos
            installer_ext: dmg
          - os: windows-latest
            profile: build-win
            artifact_name: installer-windows
            installer_ext: exe
          - os: ubuntu-latest
            profile: build-linux
            artifact_name: installer-linux
            installer_ext: deb

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: pipes-in-desert

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (with JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Install WiX Toolset (Windows only)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset\bin" >> $env:GITHUB_PATH

      - name: Build with Maven
        run: mvn clean package -P ${{ matrix.profile }}

      - name: List target/dist contents (debug)
        shell: bash
        run: |
          echo "=== Contents of target/dist ==="
          ls -laR target/dist || echo "No target/dist directory found"

      - name: Find installer file
        id: finder
        shell: bash
        run: |
          EXT="${{ matrix.installer_ext }}"
          INSTALLER=$(find target/dist -type f -name "*.$EXT" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No installer file with extension .$EXT found in target/dist"
            exit 1
          fi
          echo "installer_path=$INSTALLER" >> $GITHUB_OUTPUT
          echo "installer_name=$(basename "$INSTALLER")" >> $GITHUB_OUTPUT

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: pipes-in-desert/${{ steps.finder.outputs.installer_path }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: pipes-in-desert/${{ steps.finder.outputs.installer_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
